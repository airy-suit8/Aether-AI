# Runs on every push and pull request. Needs no secrets: the backend tests use fake models,
# a temp database and a temp vector store (backend/tests/conftest.py).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: No-orphan check (unreachable modules, untested routes, config read outside core/config.py)
        run: python -m pytest tests/test_no_orphans.py -q

      - name: Pytest with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=70

      # The modules that hold the code of the Sprint 2 list (rag_engine, rag_langchain, agent,
      # tools, auth, database, main), after the Sprint 3 restructure
      - name: Coverage of each core module is at least 70%
        run: |
          for module in \
            main.py \
            src/api/deps.py src/api/errors.py src/api/middleware.py src/api/routes_auth.py src/api/routes_chat.py src/api/routes_documents.py \
            src/api/routes_health.py src/api/schemas.py \
            src/core/config.py src/core/security.py src/core/logging.py \
            src/db/database.py \
            src/ingestion/loader.py src/chunking/chunker.py src/embeddings/embedder.py \
            src/vectordb/vector_store.py src/retrieval/retriever.py src/prompts/prompt_templates.py \
            src/llm/llm_client.py src/memory/conversation.py \
            src/pipeline/rag.py src/pipeline/documents.py \
            src/agents/agent.py src/agents/tools.py; do
            if ! python -m coverage report --include="$module" --fail-under=70 > /dev/null; then
              python -m coverage report --include="$module"
              echo "::error::$module coverage is below 70%"
              exit 1
            fi
          done

  frontend:
    name: Frontend (Node 24 LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The API types are generated from backend/tests/openapi_snapshot.json; a stale copy fails here
      - name: API types match the backend schema
        run: npm run api-types -- --check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The Playwright journey (frontend/e2e): sign up, upload, ask, threads, rating, remove, sign out,
  # with axe on the start page, the chat and settings at 1280 and 375 px. The backend runs with
  # the fake models from backend/tests/fakes.py on temp stores, so it needs no secrets either.
  e2e:
    name: Browser journey (Chromium)
    # Not ubuntu-latest: that became Ubuntu 26.04, where Playwright 1.56 cannot install
    # Chromium ("does not support chromium on ubuntu26.04-x64") (D-080)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Journey
        working-directory: frontend
        run: npm run e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

